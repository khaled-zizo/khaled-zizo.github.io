<style>
:root{--bg:#0f1720;--card:#1b2733;--line:#2b3a48;--txt:#e7eef5;--mut:#8aa0b4;--acc:#22c55e;--acc2:#3b82f6;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:'Poppins',system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0}.sub{color:var(--mut);font-size:12px;margin-top:3px}.grow{flex:1}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 70px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.f label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
select,input{width:100%;background:#0f1a24;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font-size:14px}
.langs{display:flex;flex-wrap:wrap;gap:6px}.langs span{font-size:12px;background:#0f1a24;border:1px solid var(--line);border-radius:20px;padding:5px 10px;cursor:pointer}
.langs span.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.count{color:var(--mut);font-size:13px;margin:2px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:15px}.co{color:var(--mut);font-size:12px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;background:#0f1a24;border:1px solid var(--line);border-radius:20px;padding:4px 9px}
.chip.g{border-color:var(--acc);color:#a7f3c8}.chip.b{border-color:var(--acc2);color:#bcd7ff}.chip.w{border-color:var(--warn);color:#fde3ad}.chip.m{border-color:#a855f7;color:#e3ccff}
.req{font-size:12.5px;color:var(--mut);margin:6px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act{border:none;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer}
.copy{background:var(--acc);color:#062611}.ad{background:var(--acc2);color:#fff}.open{background:#24303c;color:var(--txt);text-decoration:none}
.pri{font-size:10px;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle;color:#fff}
.Platinum{background:#7c3aed}.Gold{background:#b8860b}.Silver{background:#6b7280}.Bronze{background:#7c4a2d}
.empty{color:var(--mut);text-align:center;padding:34px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--acc);color:#062611;padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>

function num(s){return parseInt(String(s||"0").replace(/[^0-9]/g,""))||0}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;"})}
function benefits(j){var b=[];var t=((j.offerText||"")+" "+(j.benefits||"")).toLowerCase();if(has(t,"medical"))b.push("Medical Insurance");if(has(t,"social"))b.push("Social Insurance");if(has(t,"training"))b.push("Paid Training");if(has(t,"transport"))b.push("Transportation");if(has(t,"overnight"))b.push("Overnight Allowance");return b}
function adText(j){var NL=String.fromCharCode(10);var M=String.fromCharCode(96)+String.fromCharCode(96)+String.fromCharCode(96);
 var grad=allowStudent(j)?"Grads & Undergrads":"Grads only";var nat=allowForeign(j)?"Egyptians & Foreigners":"Egyptians only";var exp=reqExp(j)?"Experience required":"No experience needed";var sal=(j.salary||"").split("/")[0].trim();var bens=benefits(j);
 var L=[];L.push("🔥 *WE ARE HIRING* 🔥");L.push("*"+(j.company||"")+" — "+(j.category||"Customer Service")+"*");L.push("");
 L.push(M+"Salary"+M);L.push("💰 "+(sal||"Attractive package")+" + KPIs + Commission");L.push("");
 L.push(M+"Perks"+M);if(bens.length){bens.forEach(function(x){L.push("✅ "+x)})}else{L.push("✅ Attractive benefits package")}if(j.shiftType)L.push("🕒 "+j.shiftType+" shifts");if(j.city)L.push("📍 "+j.city);L.push("");
 L.push(M+"Who can apply"+M);L.push("🎓 "+grad);L.push("🌍 "+nat);L.push("🗣️ English: "+(j.englishLevel||"Good"));L.push("💼 "+exp);L.push("");
 L.push("👉 *Check if this fits you (20 sec):*");L.push("khaled-zizo.github.io");return L.join(NL)}
var chosen={};var fL=document.getElementById("fLangs");
LANGS.forEach(function(l){var s=document.createElement("span");s.textContent=l;s.onclick=function(){chosen[l]=!chosen[l];s.className=chosen[l]?"on":"";render()};fL.appendChild(s)});
function v(id){return document.getElementById(id).value}
function render(){
var eng=parseInt(v("fEng"))||0,grad=v("fGrad"),exp=v("fExp"),nat=v("fNat"),q=v("fSearch").toLowerCase().trim();
var res=JOBS.filter(function(j){
if(eng>0&&engMin(j.englishLevel)>eng)return false;
if(grad==="student"&&!allowStudent(j))return false;
if(nat==="for"&&!allowForeign(j))return false;
if(exp==="no"&&reqExp(j))return false;
var jl=jobLangs(j);if(jl.length){var ok=false;jl.forEach(function(l){if(chosen[l])ok=true});if(!ok)return false}
if(q){var h=((j.company||"")+" "+(j.title||"")+" "+(j.category||"")+" "+(j.city||"")).toLowerCase();if(h.indexOf(q)<0)return false}
return true});
res.sort(function(a,b){var la=jobLangs(a).some(function(l){return chosen[l]})?1:0;var lb=jobLangs(b).some(function(l){return chosen[l]})?1:0;if(lb!==la)return lb-la;return num(b.commission)-num(a.commission)});
document.getElementById("count").textContent=res.length+" offer"+(res.length===1?"":"s")+" · highest commission first";
var R=document.getElementById("results");R.innerHTML="";
if(!res.length){R.innerHTML='<div class="empty">No active offer matches these criteria.</div>';return}
res.forEach(function(j){
var jl=jobLangs(j),c="";
if(j.commission)c+='<span class="chip m">commission '+esc(j.commission)+'</span>';
c+='<span class="chip b">'+esc(j.englishLevel||"Any")+' English</span>';
if(j.nationality)c+='<span class="chip">'+esc(j.nationality)+'</span>';
if(j.graduation)c+='<span class="chip">'+esc(j.graduation)+'</span>';
c+=reqExp(j)?'<span class="chip w">needs experience</span>':'<span class="chip g">no exp ok</span>';
if(jl.length)c+='<span class="chip b">'+esc(jl.join(", "))+'</span>';
if(j.salary)c+='<span class="chip g">'+esc(j.salary)+'</span>';
if(j.city)c+='<span class="chip">'+esc(j.city)+'</span>';
var pri=j.priority?'<span class="pri '+j.priority+'">'+j.priority+'</span>':'';
var card=document.createElement("div");card.className="card";
card.innerHTML='<h3>'+esc(j.title)+pri+'</h3><div class="co">'+esc(j.company)+' &middot; '+esc(j.category||"")+'</div><div class="chips">'+c+'</div><div class="btns"><button class="act copy">Copy message (to candidate)</button><button class="act ad">Copy ad (for groups)</button><a class="act open" target="_blank" rel="noopener" href="https://moslla.com/recruiter-portal/guide/job/'+j.id+'">Open on portal</a></div>';
card.querySelector(".copy").onclick=function(){navigator.clipboard.writeText(j.offerText||"").then(toast)};
card.querySelector(".ad").onclick=function(){navigator.clipboard.writeText(adText(j)).then(toast)};
R.appendChild(card)});
}
var tt;function toast(){var t=document.getElementById("toast");t.className="toast show";clearTimeout(tt);tt=setTimeout(function(){t.className="toast"},1200)}
["fEng","fGrad","fExp","fNat","fSearch"].forEach(function(id){document.getElementById(id).addEventListener("input",render)});
document.getElementById("save").onclick=function(){var clone=document.documentElement.cloneNode(true);var rs=clone.querySelector("#results");if(rs)rs.innerHTML="";var fl=clone.querySelector("#fLangs");if(fl)fl.innerHTML="";var h="<!doctype html>"+clone.outerHTML;var b=new Blob([h],{type:"text/html;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hub.html";document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000)};
document.getElementById("sub").textContent=JOBS.length+" active offers · pulled "+new Date().toLocaleDateString();
render();
})();
</script></body></html>
