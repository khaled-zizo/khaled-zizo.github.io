function num(s){return parseInt(String(s||"0").replace(/[^0-9]/g,""))||0}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;"})}
function benefits(j){var b=[];var t=((j.offerText||"")+" "+(j.benefits||"")).toLowerCase();if(has(t,"medical"))b.push("Medical Insurance");if(has(t,"social"))b.push("Social Insurance");if(has(t,"training"))b.push("Paid Training");if(has(t,"transport"))b.push("Transportation");if(has(t,"overnight"))b.push("Overnight Allowance");return b}
var chosen={};var fL=document.getElementById("fLangs");
LANGS.forEach(function(l){var s=document.createElement("span");s.textContent=l;s.onclick=function(){chosen[l]=!chosen[l];s.className=chosen[l]?"on":"";render()};fL.appendChild(s)});
function v(id){return document.getElementById(id).value}
function applyLink(j){var engTxt=document.getElementById("fEng").selectedOptions[0].text;var grad=v("fGrad")==="student"?"Student/Undergrad":(v("fGrad")==="grad"?"Graduate":"-");var exp=v("fExp")==="yes"?"Have experience":(v("fExp")==="no"?"No experience":"-");var nat=v("fNat")==="for"?"Foreigner":"Egyptian";var NL=String.fromCharCode(10);var msg=["Hi "+RECRUITER+"! I want to apply for: "+(j.company||"")+" - "+(j.title||j.category||""),"My info: English "+engTxt+" | "+grad+" | "+exp+" | "+nat,"I will send a 30-second English voice note next"].join(NL);return "https://wa.me/"+NUM+"?text="+encodeURIComponent(msg)}
function render(){
var eng=parseInt(v("fEng"))||0,grad=v("fGrad"),exp=v("fExp"),nat=v("fNat");
var res=JOBS.filter(function(j){
if(eng>0&&engMin(j.englishLevel)>eng)return false;
if(grad==="student"&&!allowStudent(j))return false;
if(nat==="for"&&!allowForeign(j))return false;
if(exp==="no"&&reqExp(j))return false;
var jl=jobLangs(j);if(jl.length){var ok=false;jl.forEach(function(l){if(chosen[l])ok=true});if(!ok)return false}
return true});
res.sort(function(a,b){var la=jobLangs(a).some(function(l){return chosen[l]})?1:0;var lb=jobLangs(b).some(function(l){return chosen[l]})?1:0;if(lb!==la)return lb-la;return num(b.salary)-num(a.salary)});
document.getElementById("count").textContent=res.length?(res.length+" job"+(res.length===1?"":"s")+" match you — tap Apply on the one you like"):"";
var R=document.getElementById("results");R.innerHTML="";
if(!res.length){R.innerHTML='<div class="empty">No job matches these answers right now. Try changing your English level or experience, or check back soon.</div>';return}
res.forEach(function(j){
var card=document.createElement("div");card.className="card";
var m="";var jl=jobLangs(j);
if(jl.length)m+='<span class="chip b">'+esc(jl.join(", "))+' speakers</span>';
if(j.city)m+='<span class="chip">'+esc(j.city)+'</span>';
if(j.shiftType)m+='<span class="chip">'+esc(j.shiftType)+' shift</span>';
if(j.workingDays)m+='<span class="chip">'+esc(j.workingDays)+'</span>';
if(j.englishLevel)m+='<span class="chip b">English '+esc(j.englishLevel)+'</span>';
var bl=benefits(j).map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join("");
card.innerHTML='<h3>'+esc(j.category||j.title)+'</h3><div class="co">'+esc(j.company)+'</div><div class="sal">'+esc(j.salary||"Attractive package")+'</div><div class="meta">'+m+'</div>'+(bl?'<div class="meta">'+bl+'</div>':'')+'<a class="apply" target="_blank" rel="noopener" href="'+applyLink(j)+'">Apply on WhatsApp</a>';
R.appendChild(card)});
}
window.saveClean=function(){var clone=document.documentElement.cloneNode(true);var bar=clone.querySelector("#hostbar");if(bar)bar.remove();var fl=clone.querySelector("#fLangs");if(fl)fl.innerHTML="";var rs=clone.querySelector("#results");if(rs)rs.innerHTML="";var h="<!doctype html>"+clone.outerHTML;var b=new Blob([h],{type:"text/html;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="index.html";document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000)};
["fNat","fGrad","fEng","fExp"].forEach(function(id){document.getElementById(id).addEventListener("change",render)});
document.getElementById("foot").textContent="Offers updated "+new Date().toLocaleDateString()+" · Mosla Pioneers";
render();
})();
</script></body></html>
